name = "hibana"
grammar = "hibana"
path_suffixes = ["hb"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 4
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
