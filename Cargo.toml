[package]
name = "hibana"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
sha2 = "0.10"
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.21"
z3 = "0.21.1"
toml = { version = "1.1.6", features = ["preserve_order"] }
wasm-encoder = "0.227.1"
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-native = "0.137.1"

[features]
# Z3 をソースからビルドして静的にリンクする（時間がかかる。実行ファイル1つで動く）
static = ["z3/bundled"]
